name: SINTU CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

# Keep only the newest validation for a branch/PR; stale commits must not
# occupy runners while the current head waits in the queue.
concurrency:
  group: sintu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3
        with:
          version: "release"
      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -filters | grep -q subtitles
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app tests scripts
      - name: Validate Termux launcher syntax
        run: bash -n START_SINTU_TERMUX.sh scripts/termux_one_command.sh scripts/start_services.sh scripts/restart_termux_workers.sh scripts/termux_boot.sh
      - name: Check browser JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/production_studio.js
          node --check app/static/earnings.js
          node --check app/static/login.js
          node --check app/static/register-sw.js
      - name: Run browser timeline preview lifecycle tests
        run: node --test tests/*.test.cjs
      - name: Run test suite
        run: python -m pytest -q


  browser-e2e:
    name: Real Chromium Video Editor browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [test]
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install pinned Playwright
        run: npm install --prefix tests/browser --no-audit --no-fund --package-lock=false
      - name: Install Chromium and browser dependencies
        run: tests/browser/node_modules/.bin/playwright install chromium
      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3
        with:
          version: "release"
      - name: Run real browser Video Editor acceptance tests
        run: node --test tests/browser/*.test.cjs

  offline-video-e2e:
    name: Offline branded video E2E and motion audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test]
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3
        with:
          version: "release"
      - name: Install free local voice and font tools
        run: |
          # The regional EC2 mirror and security.ubuntu.com returned repeated 503s.
          # Pin this short-lived CI install to the canonical Ubuntu archive mirror.
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i \
            -e 's|http://us-east-2.ec2.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|https://us-east-2.ec2.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://security.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|https://security.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
                    font_family="$(fc-match -f '%{family}' 'Noto Sans Devanagari' 2>/dev/null | cut -d, -f1 || true)"
          if ! command -v espeak-ng >/dev/null 2>&1 || [[ "$font_family" != "Noto Sans Devanagari" ]]; then
            # GitHub's Ubuntu image often already has a usable apt package index.
            # Reuse it when both packages are indexed; only contact slow mirrors
            # when package metadata is genuinely missing.
            if ! apt-cache show espeak-ng >/dev/null 2>&1 || ! apt-cache show fonts-noto-core >/dev/null 2>&1; then
              timeout 600 sudo apt-get \
                -o Acquire::Retries=5 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                -o Acquire::Languages=none \
                update -qq
            fi
            timeout 900 sudo apt-get \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              install -y --no-install-recommends espeak-ng fonts-noto-core
          fi
          ffmpeg -version
          ffprobe -version
          espeak-ng --voices=hi
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Generate real offline Hindi video
        env:
          SINTU_DATA_DIR: ${{ github.workspace }}/.ci-data
          ESPEAK_EXECUTABLE: espeak-ng
          SINTU_RENDER_TIMEOUT_SECONDS: "600"
        run: |
          set -euo pipefail
          python scripts/live_e2e.py --offline-video --topic "भारत के 10 रहस्यमयी किलों पर 60 सेकंड का हिंदी वीडियो" | tee offline-video-report.json
      - name: Enforce 60-second Hindi subtitle acceptance
        run: |
          python -c 'import json; r=json.load(open("offline-video-report.json", encoding="utf-8")); v=r["live_tests"]["offline_storyboard_video"]; assert abs(v["duration_seconds"]-60) <= 0.1, v; assert v["subtitle_count"] == 15 and v["subtitles_burned_in"] is True, v; assert v["audio"] == "voiceover+music", v; assert "SINTU Procedural Art (offline)" in v["image_providers"], v; print("60-second Hindi video, 15 burned subtitle cues, narration, music and truthful procedural-art provenance: PASS")'

      - name: Audit final MP4 metadata, black frames and sampled motion
        env:
          SINTU_DATA_DIR: ${{ github.workspace }}/.ci-data
        run: |
          python scripts/project_health_audit.py --skip-tests \
            --media-dir .ci-data/generated_videos --report offline-media-audit.json
      - name: Enforce continuous camera motion (not a still-image slideshow)
        run: |
          python -c 'import json; r=json.load(open("offline-media-audit.json", encoding="utf-8")); m=next(x for x in r["checks"] if x["check"].startswith("media:")); ratio=(m.get("motion") or {}).get("motion_ratio", 0); print("Sampled motion ratio:", ratio); assert ratio >= 0.60, "Storyboard camera motion is too weak or freezes between scenes"'
      - name: Preserve generated video and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sintu-offline-video-e2e
          path: |
            .ci-data/generated_videos/*.mp4
            offline-video-report.json
            offline-media-audit.json
          if-no-files-found: warn
          retention-days: 7

  dependency-audit:
    name: Python dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit declared dependencies
        run: pip-audit -r requirements-dev.txt

  docker:
    name: Production Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test, dependency-audit]
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Validate production Compose configuration
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --pull --tag sintu-ai-youtube-studio:ci .
      - name: Boot production image and verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker volume create sintu-ci-data >/dev/null
          cleanup() {
            docker logs sintu-ci-app 2>&1 || true
            docker rm --force sintu-ci-app >/dev/null 2>&1 || true
            docker volume rm sintu-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name sintu-ci-app \
            --publish 127.0.0.1:8000:8000 \
            --env PORT=8000 \
            --env SINTU_DATA_DIR=/data \
            --env SINTU_AUTH_REQUIRED=false \
            --env SINTU_SESSION_SECRET=ci-only-not-for-production \
            --volume sintu-ci-data:/data \
            sintu-ai-youtube-studio:ci >/dev/null
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/api/health \
              | python -c 'import json,sys; data=json.load(sys.stdin); sys.exit(0 if data.get("status") == "ok" else 1)'; then
              echo "Production container health check passed."
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' sintu-ci-app 2>/dev/null || true)" != "true" ]; then
              echo "Production container exited before becoming healthy."
              docker logs sintu-ci-app || true
              exit 1
            fi
            sleep 2
          done
          echo "Production container did not become healthy within 90 seconds."
          docker logs sintu-ci-app || true
          exit 1

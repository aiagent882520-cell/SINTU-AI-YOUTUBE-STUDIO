name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep only the newest CI run for a branch/PR. Rapid commits should not
# leave a queue of obsolete full test-and-Docker builds behind.
concurrency:
  group: sintu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: Ensure FFmpeg is available for media integration tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            # Runner images already provide apt package indexes. Avoid a full
            # apt-get update on every commit; install only the missing package.
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall -q app tests
      - name: Check browser JavaScript syntax
        run: node --check app/static/app.js && node --check app/static/production_studio.js
      - name: Run tests
        run: pytest -q
      - name: Build production Docker image
        run: docker build -t sintu-ai-youtube-studio:ci .

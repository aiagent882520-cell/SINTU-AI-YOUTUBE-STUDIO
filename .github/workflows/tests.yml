name: SINTU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: sintu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app tests scripts
      - name: Check browser JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/production_studio.js
      - name: Run test suite
        run: python -m pytest -q

  dependency-audit:
    name: Python dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit declared dependencies
        run: pip-audit -r requirements-dev.txt

  docker:
    name: Production Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test, dependency-audit]
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Validate production Compose configuration
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --pull --tag sintu-ai-youtube-studio:ci .
      - name: Boot production image and verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker volume create sintu-ci-data >/dev/null
          cleanup() {
            docker logs sintu-ci-app 2>&1 || true
            docker rm --force sintu-ci-app >/dev/null 2>&1 || true
            docker volume rm sintu-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name sintu-ci-app \
            --publish 127.0.0.1:8000:8000 \
            --env PORT=8000 \
            --env SINTU_DATA_DIR=/data \
            --env SINTU_AUTH_REQUIRED=false \
            --env SINTU_SESSION_SECRET=ci-only-not-for-production \
            --volume sintu-ci-data:/data \
            sintu-ai-youtube-studio:ci >/dev/null
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/api/health \
              | python -c 'import json,sys; data=json.load(sys.stdin); sys.exit(0 if data.get("status") == "ok" else 1)'; then
              echo "Production container health check passed."
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' sintu-ci-app 2>/dev/null || true)" != "true" ]; then
              echo "Production container exited before becoming healthy."
              docker logs sintu-ci-app || true
              exit 1
            fi
            sleep 2
          done
          echo "Production container did not become healthy within 90 seconds."
          docker logs sintu-ci-app || true
          exit 1


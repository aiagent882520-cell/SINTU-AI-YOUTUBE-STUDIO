services:
  sintu-ai-studio:
    build: .
    container_name: sintu-ai-studio
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      SINTU_DATA_DIR: /data
      SINTU_AUTH_REQUIRED: "true"
      SINTU_ADMIN_USERNAME: ${SINTU_ADMIN_USERNAME:-admin}
      SINTU_ADMIN_PASSWORD: ${SINTU_ADMIN_PASSWORD:-}
      SINTU_SESSION_SECRET: ${SINTU_SESSION_SECRET:-}
      SINTU_COOKIE_SECURE: ${SINTU_COOKIE_SECURE:-false}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      PIPER_EXECUTABLE: ${PIPER_EXECUTABLE:-piper}
      PIPER_MODEL_PATH: ${PIPER_MODEL_PATH:-}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      COMFYUI_IMAGE_WORKFLOW_PATH: ${COMFYUI_IMAGE_WORKFLOW_PATH:-}
      COMFYUI_VIDEO_WORKFLOW_PATH: ${COMFYUI_VIDEO_WORKFLOW_PATH:-}
      MUSIC_PROVIDER: ${MUSIC_PROVIDER:-local}
      SINTU_REVENUE_CONFIRMED: ${SINTU_REVENUE_CONFIRMED:-false}
      ALLOW_PAID_UPGRADES: ${ALLOW_PAID_UPGRADES:-false}
      ENABLE_PAID_MEDIA_GENERATION: ${ENABLE_PAID_MEDIA_GENERATION:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
      MEDIA_GENERATION_TOKEN: ${MEDIA_GENERATION_TOKEN:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-}
      YOUTUBE_TOKEN_ENCRYPTION_KEY: ${YOUTUBE_TOKEN_ENCRYPTION_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v26.0}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
    volumes:
      - sintu-data:/data
    restart: unless-stopped

volumes:
  sintu-data:

<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><title>SINTU AI YOUTUBE STUDIO — Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#101827;color:#eef3fb;font:16px system-ui,sans-serif}.card{width:min(100%,420px);padding:28px;border:1px solid #34445b;border-radius:20px;background:#182438;box-shadow:0 18px 60px #0005}.brand{color:#8ab4ff;font-weight:800;letter-spacing:.12em;font-size:12px}h1{margin:10px 0 6px;font-size:27px}p{color:#aebbd0;line-height:1.5}label{display:block;margin:18px 0 7px;font-size:14px}input{width:100%;padding:14px;border-radius:10px;border:1px solid #455670;background:#0f1929;color:#fff;font:inherit}button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:10px;background:#78a9ff;color:#101827;font-weight:800;font-size:16px}button:disabled{opacity:.6}#message{min-height:24px;color:#ffb7a9;font-size:14px}
</style></head>
<body><main class="card"><img src="/static/brand-logo.svg" alt="SINTU AI YOUTUBE STUDIO" style="display:block;width:min(100%,300px);height:150px;object-fit:contain;margin:0 auto 12px"><div class="brand">SINTU AI YOUTUBE STUDIO</div><h1>Admin Login</h1><p>Apne private studio dashboard mein sign in karein.</p>
<form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required maxlength="80"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit" type="submit">Secure Login</button><p id="message" role="status" aria-live="polite"></p></form></main>
<script>
document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("submit"),m=document.getElementById("message");b.disabled=true;m.textContent="Checking credentials…";try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||"Login failed");location.replace("/");}catch(err){m.textContent=err.message;}finally{b.disabled=false;}});
</script></body></html>

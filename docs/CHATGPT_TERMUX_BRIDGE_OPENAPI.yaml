openapi: 3.1.0
info:
  title: SINTU Termux Bridge
  version: 1.0.0
  description: Queue allowlisted jobs for the local Termux worker. No arbitrary shell execution. In automation-only mode, media repair and production E2E actions are paused.
servers:
  - url: https://YOUR-HTTPS-TUNNEL-HOST
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    JobRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [git_status, git_pull_ff_only, run_tests, main_worktree_tests, compile_check, automation_self_test, health_audit, operational_readiness, live_preflight, engine_probe, safe_optional_install, restart_services, media_repair, media_forensics, watchdog_recovery_test, offline_video_e2e, full_self_test, full_studio_e2e]
        test_path:
          type: string
          maxLength: 160
          description: Optional existing Python test file directly inside tests/, only for run_tests; omit to run the full suite.
        topic:
          type: string
          maxLength: 300
          description: Optional topic for offline_video_e2e, full_self_test, or full_studio_e2e only. Paused by default in automation-only mode.
    Job:
      type: object
      properties:
        job_id: { type: string }
        action: { type: string }
        status: { type: string }
    JobResult:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        status: { type: string }
        exit_code: { type: integer }
        output: { type: string }
security:
  - bearerAuth: []
paths:
  /api/termux-bridge/status:
    get:
      operationId: getBridgeStatus
      summary: Check whether the Termux worker is online and inspect queued jobs
      responses:
        "200":
          description: Bridge status
  /api/termux-bridge/jobs:
    post:
      operationId: queueTermuxJob
      summary: Queue one safe allowlisted Termux action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /api/termux-bridge/jobs/{job_id}:
    get:
      operationId: getTermuxJob
      summary: Read the status and bounded output of a queued Termux job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
